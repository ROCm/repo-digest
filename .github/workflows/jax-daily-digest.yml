name: Daily JAX Digest

on:
  schedule:
    - cron: '0 11 * * *'  # Runs daily at 11:00 AM UTC (offset from XLA/Triton at 8, LLVM at 9, MaxText at 10)
  workflow_dispatch:  # Allows manual triggering

jobs:
  digest:
    uses: ./.github/workflows/_digest.yml
    permissions:
      contents: read
    with:
      repository: jax-ml/jax
      checkout_path: jax
      config: .claude/projects/jax.md
      days: 1
      artifact_name: jax-digest
      timeout_minutes: 30
    secrets:
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      LLM_GATEWAY_KEY: ${{ secrets.LLM_GATEWAY_KEY }}
      USER_NTID: ${{ secrets.USER_NTID }}
