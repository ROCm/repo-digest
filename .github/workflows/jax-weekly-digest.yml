name: Weekly JAX Digest

on:
  schedule:
    - cron: '0 0 * * 1'  # Runs every Monday at 12:00 AM UTC (offset from Triton weekly Sun 8 PM, MaxText weekly Sun 10 PM, LLVM weekly Mon 10 AM)
  workflow_dispatch:  # Allows manual triggering

jobs:
  digest:
    uses: ./.github/workflows/_digest.yml
    permissions:
      contents: read
    with:
      repository: jax-ml/jax
      checkout_path: jax
      config: .claude/projects/jax.md
      days: 7
      artifact_name: jax-weekly-digest
      timeout_minutes: 60
    secrets:
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      LLM_GATEWAY_KEY: ${{ secrets.LLM_GATEWAY_KEY }}
      USER_NTID: ${{ secrets.USER_NTID }}
