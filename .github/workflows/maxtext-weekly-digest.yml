name: Weekly MaxText Digest

on:
  schedule:
    - cron: '0 22 * * 0'  # Runs every Sunday at 10:00 PM UTC
  workflow_dispatch:  # Allows manual triggering

jobs:
  digest:
    uses: ./.github/workflows/_digest.yml
    permissions:
      contents: read
    with:
      repository: AI-Hypercomputer/maxtext
      checkout_path: maxtext
      config: .claude/projects/maxtext.md
      days: 7
      artifact_name: maxtext-weekly-digest
      timeout_minutes: 60
    secrets:
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      LLM_GATEWAY_KEY: ${{ secrets.LLM_GATEWAY_KEY }}
      USER_NTID: ${{ secrets.USER_NTID }}
