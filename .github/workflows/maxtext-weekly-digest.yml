name: Weekly MaxText Digest

on:
  schedule:
    - cron: '0 22 * * 0'  # Runs every Sunday at 10:00 PM UTC
  workflow_dispatch:  # Allows manual triggering

jobs:
  digest:
    runs-on: build-only-repo-digest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Checkout MaxText Repository
        uses: actions/checkout@v6
        with:
          repository: AI-Hypercomputer/maxtext
          path: maxtext
          ref: main
          fetch-depth: 0

      - name: Generate Digest
        id: claude-code
        timeout-minutes: 60
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_CUSTOM_HEADERS: |
            Ocp-Apim-Subscription-Key: ${{ secrets.LLM_GATEWAY_KEY }}
            user: ${{ secrets.USER_NTID }}
          ANTHROPIC_MODEL: "Claude-Sonnet-4.6"
          ANTHROPIC_DEFAULT_OPUS_MODEL: "Claude-Opus-4.6"
          ANTHROPIC_DEFAULT_SONNET_MODEL: "Claude-Sonnet-4.6"
          ANTHROPIC_DEFAULT_HAIKU_MODEL: "Claude-Haiku-4.5"
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: "sk-ant-dummy-gateway-key"
          prompt: |
            .claude/projects/maxtext.md
            7
          claude_args: "--agent digest --allowedTools Bash,Write,Edit,Read,Glob,Grep,TodoWrite,Task"
          settings: |
            {
              "hasCompletedOnboarding": true
            }

      - name: Upload Digest
        uses: actions/upload-artifact@v4
        with:
          name: maxtext-weekly-digest
          path: "digests/digest-*.md"

      - name: Upload Claude Execution Log
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution-log
          path: ${{ steps.claude-code.outputs.execution_file }}
