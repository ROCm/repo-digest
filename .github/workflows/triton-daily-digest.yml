name: Daily TRITON Digest

on:
  schedule:
    - cron: '0 8 * * *'  # Runs daily at 8:00 AM UTC
  workflow_dispatch:  # Allows manual triggering

jobs:
  digest:
    uses: ./.github/workflows/_digest.yml
    permissions:
      contents: read
    with:
      repository: triton-lang/triton
      checkout_path: triton
      config: .claude/projects/triton.md
      days: 1
      artifact_name: digest
      timeout_minutes: 30
    secrets:
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      LLM_GATEWAY_KEY: ${{ secrets.LLM_GATEWAY_KEY }}
      USER_NTID: ${{ secrets.USER_NTID }}
