name: Weekly LLVM Digest (AMD/AMDGPU/ROCm)

on:
  schedule:
    - cron: '0 10 * * 1'  # Runs weekly on Monday at 10:00 AM UTC
  workflow_dispatch:  # Allows manual triggering

jobs:
  digest:
    uses: ./.github/workflows/_digest.yml
    permissions:
      contents: read
    with:
      repository: llvm/llvm-project
      checkout_path: llvm-project
      config: .claude/projects/llvm.md
      days: 7
      artifact_name: llvm-digest-weekly
      timeout_minutes: 60
    secrets:
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      LLM_GATEWAY_KEY: ${{ secrets.LLM_GATEWAY_KEY }}
      USER_NTID: ${{ secrets.USER_NTID }}
