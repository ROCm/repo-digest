name: Daily MaxText Digest

on:
  schedule:
    - cron: '0 10 * * *'  # Runs daily at 10:00 AM UTC
  workflow_dispatch:  # Allows manual triggering

jobs:
  digest:
    uses: ./.github/workflows/_digest.yml
    permissions:
      contents: read
    with:
      repository: AI-Hypercomputer/maxtext
      checkout_path: maxtext
      config: .claude/projects/maxtext.md
      days: 1
      artifact_name: maxtext-digest
      timeout_minutes: 30
    secrets:
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      LLM_GATEWAY_KEY: ${{ secrets.LLM_GATEWAY_KEY }}
      USER_NTID: ${{ secrets.USER_NTID }}
